# CD — деплой по push в main (см. docs/07-deployment.md §CI/CD, ADR-006).
#
# Триггер: push в main → SSH на сервер → в /opt/aichat:
#   git pull --ff-only
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   docker image prune -f
#
# Секреты доступа CI к серверу — ТОЛЬКО в GitHub Secrets (никаких прикладных секретов
# здесь): SSH_HOST, SSH_USER, SSH_PRIVATE_KEY. Прикладной /opt/aichat/.env на сервере
# gitignored и CI его не трогает (git pull не перезаписывает untracked-файл).
#
# concurrency: деплои не накладываются — новый push отменяет/ждёт предыдущий.

name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to shared server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Жёсткие флаги: остановиться на первой ошибке.
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/aichat

            # Зафиксировать текущий рабочий commit ДО pull — точка отката.
            PREV="$(git rev-parse HEAD)"

            # rollback(): вернуть код на PREV и пересобрать прод-стек, затем уронить job.
            # Вызывается при провале post-deploy healthcheck. trap снимается перед откатом,
            # чтобы ошибки внутри rollback не вызвали рекурсию.
            rollback() {
              echo "Deploy failed — rolling back to ${PREV}"
              trap - ERR
              git reset --hard "$PREV"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
              echo "Rolled back to ${PREV}. Marking deploy as failed."
              exit 1
            }
            # Любая необработанная ошибка после установки trap → откат
            # (set -e + trap ERR ловит сбой git pull / compose build тоже).
            trap rollback ERR

            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Post-deploy healthcheck gate: up -d возвращает 0 сразу, поэтому ждём,
            # пока сервис реально отвечает (CrashLoop/упавшая миграция → откат).
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS https://velunoapp.shop/healthz >/dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Healthcheck did not pass within timeout"
              rollback
            fi
            # Финальная строгая проверка: ненулевой код через trap уронит job (с откатом).
            curl -fsS https://velunoapp.shop/healthz >/dev/null

            # Деплой успешен — снять trap и подчистить старые образы.
            trap - ERR
            docker image prune -f
